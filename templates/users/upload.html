<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bulk Upload Users</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: #f5f7fa;
            color: #333;
        }

        .container {
            max-width: 500px;
            margin: 60px auto;
            background: #fff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #222;
        }

        form input[type="file"],
        form input[type="submit"] {
            width: 100%;
            padding: 12px;
            margin: 12px 0;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 16px;
        }

        form input[type="submit"] {
            background-color: #4f46e5;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: background-color 0.3s ease;
        }

        form input[type="submit"]:hover {
            background-color: #3730a3;
        }

        .message {
            margin-top: 20px;
            text-align: center;
            font-weight: bold;
            color: #4f46e5;
        }

        #loading-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(255, 255, 255, 0.9);
            z-index: 9999;
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .loader {
            width: 60%;
            height: 6px;
            background-color: #ddd;
            border-radius: 6px;
            overflow: hidden;
            margin-top: 16px;
        }

        .loader-bar {
            height: 100%;
            width: 0;
            background-color: #4f46e5;
            transition: width 0.3s ease-in-out;
        }

        @keyframes loadingBar {
            0% { width: 0; }
            50% { width: 100%; }
            100% { width: 0; }
        }
        #progress-text {
            margin-top: 10px;
            font-size: 14px;
            color: #333;
        }

    </style>
</head>
<body>
<div class="container">
    <h2>Upload Users via CSV</h2>
    <form method="post" enctype="multipart/form-data" id="upload-form">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="submit" value="Submit">
    </form>

    {% if message %}
        <p class="message">{{ message }}</p>
    {% endif %}
</div>

<div id="loading-overlay">
    <p>Creating users, please wait...</p>
    <div class="loader">
        <div id="progress-bar" class="loader-bar" style="width: 0"></div>
    </div>
    <p id="progress-text">0%</p>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const form = document.getElementById('upload-form');
        const loadingOverlay = document.getElementById('loading-overlay');
        const progressBar = document.getElementById('progress-bar');
        const progressText = document.getElementById('progress-text');

        let intervalId = null;

        function updateProgress() {
            fetch("{% url 'get_progress' %}")
                .then(response => response.json())
                .then(data => {
                    const percent = Math.round(parseFloat(data.progress));
                    progressBar.style.width = percent + '%';
                    progressText.textContent = percent + '%';

                    if (percent >= 100) {
                        clearInterval(intervalId);
                        setTimeout(() => {
                            loadingOverlay.style.display = 'none';
                            location.reload();
                        }, 1000);
                    }
                });
        }

        form.addEventListener('submit', function () {
            loadingOverlay.style.display = 'flex';
            intervalId = setInterval(updateProgress, 500);
        });
    });
</script>
</body>
</html>
