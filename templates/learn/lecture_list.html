{% extends 'base.html' %}
{% block content %}
<h2>Lectures</h2>

{% if user == course.faculty %}
    <a href="{% url 'upload-lecture' course.pk %}" class="btn btn-success">+ Add Lecture</a>
{% endif %}

<ul>
    {% for lecture in lectures %}
        <li>{{ lecture.name }}</li>
    {% empty %}
        <li>No lectures available.</li>
    {% endfor %}
</ul>
{% endblock %}
