{% extends 'base.html' %}

{% block content %}
    <h2>Create Study Material for {{ course.name }}</h2>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        
        <h3>URL Material</h3>
        {{ url_form.as_p }}
        
        <h3>PDF Material</h3>
        {{ pdf_form.as_p }}
        
        <button type="submit">Submit</button>
    </form>

    <br>
    <a href="{% url 'learn:course_detail' course.pk %}">Back to course</a>
{% endblock %}
