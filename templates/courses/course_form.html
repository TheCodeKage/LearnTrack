{% extends "base.html" %}
{% block title %}{{ view.object.pk|yesno:"Edit Course,Create New Course" }}{% endblock %}
{% block content %}
<h2>{{ view.object.pk|yesno:"Edit Course,Create New Course" }}</h2>

<form method="post" enctype="multipart/form-data">
  {% csrf_token %}
  {{ form.as_p }}

  <button type="submit">Save</button>
  <a href="{% url 'course_list' %}" class="btn-secondary" style="padding: 10px 16px; text-decoration: none; color: white;">Cancel</a>
</form>
{% endblock %}
